    <main>
        <div class="header_logo-box">
            <img src="/pictures/logo.jpeg" alt="Logo" class="header_logo">
        </div>
        <h1 class="heading-secondary">Contact Submission Form</h1>

        <form id="form"class="contact-form">
            <div class="form-group">
                <label>Name :</label>
                <input type="text" name="name" placeholder="*John Doe" required>
            </div>

            <div class="form-group">
                <label>Email :</label>
                <input type="email" name="email" placeholder="*JohnDoe123@gmail.com" required>
            </div>

             <div class="form-group">
                <label>Phone :</label>
                <input type="tel" name="number" placeholder="*123-456-7890" required pattern="^[0-9]{3}-[0-9]{3}-[0-9]{4}">
            </div>

             <div class="form-group">
                <label>Comments :</label>
                <textarea rows="5" placeholder="I would love to get to know your thoughts, please reach out with concerns, feedback or oppurtunities!"></textarea>
            </div>

            <button type="submit">Submit</button>
        </form>

        <div id="pop-up">
                <div class="pop-up-content"><p>Thank you for completing the contact form, I will respond as soon as possible!</p>
                    <button id="close-pop-up">Close</button>
                </div>
            </div>
       
    </main>
